[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fheat"
version = "0.1.0"
description = "District-heating network planning from geodata: core pipeline plus NRW and flexible data adapters."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Philipp Sommer", email = "philipp.sommer@fh-muenster.de" },
    { name = "Patrick Weßeler", email = "patrick.wesseler@fh-muenster.de" },
    { name = "Hinnerk Willenbrink", email = "willenbrink@fh-muenster.de" },
    ]
keywords = [
    "district heating", "heat planning",
    "geodata", "GIS", "energy",
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    # Core pipeline + flexible adapter (works out of the box).
    "geopandas>=0.14",
    "pandas>=2.0",
    "shapely>=2.0",
    "networkx>=3.0",
    "numpy>=1.24",
    "demandlib>=0.1.9",
]

[project.optional-dependencies]
nrw = ["owslib>=0.29", "lxml>=4.9"]         # NRW auto-download adapter (WFS + ZIP)
holidays = ["workalendar>=17.0"]           # German public holidays for the SLP load profile
excel = ["openpyxl>=3.1"]                  # only for writing .xlsx in the examples (pd.ExcelWriter)
topotherm = [                                # expert mode: topotherm STS optimisation
    # topotherm ITSELF IS NOT LISTED HERE ON PURPOSE. It is not published on
    # PyPI (only github.com/jylambert/topotherm), so naming it would make this
    # extra unresolvable and abort the whole install command. A direct git URL
    # is no alternative either: PyPI rejects direct references in Requires-Dist.
    # Everything PyPI *can* deliver lives here; topotherm itself has to be
    # installed separately AND EDITABLE — see the README for the command.
    "pandas<3",                              # topotherm 0.6.0 breaks on pandas 3.x
    "highspy>=1.7",                          # open-source MILP solver
]
full = ["owslib>=0.29", "lxml>=4.9", "workalendar>=17.0"]
dev = ["pytest>=7.0", "build>=1.0", "twine>=5.0"]

# NOTE: there is deliberately no [dependency-groups] entry for topotherm.
# A PEP 735 group can only hold requirement strings, and topotherm 0.6.0 has
# to be installed EDITABLE: its own packaging declares
#     [tool.setuptools] packages = ["topotherm"]
# which omits the topotherm.models subpackage, so a regular install yields a
# package whose __init__ dies on "from . import models". An editable install
# imports straight from the checkout and is unaffected.

[project.urls]
Homepage = "https://www.fh-muenster.de/de/iep/fheat/index"
Repository = "https://github.com/F-Heat/fheat"
Issues = "https://github.com/F-Heat/fheat/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fheat_core.data" = ["*.csv"]
"fheat_nrw.data" = ["*.json", "*.csv"]
