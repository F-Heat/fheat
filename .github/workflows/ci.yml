name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Projekt und Test-Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[full,dev,excel]"

      - name: Tests ausführen
        run: python -m pytest

  package:
    name: Paket bauen und prüfen
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build-Werkzeuge installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Source Distribution und Wheel bauen
        run: python -m build

      - name: Paketmetadaten prüfen
        run: python -m twine check --strict dist/*