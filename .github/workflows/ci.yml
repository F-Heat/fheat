name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Projekt und Test-Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[full,dev,excel,plots]"

      - name: Tests ausführen
        run: python -m pytest

  package:
    name: Paket bauen und prüfen
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build-Werkzeuge installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Source Distribution und Wheel bauen
        run: python -m build

      - name: Paketmetadaten prüfen
        run: python -m twine check --strict dist/*

  expert:
    name: Expert-Modus (topotherm, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Nutzbares Fenster für topotherm 0.6.0 — faktisch nur 3.12:
        #   < 3.12   -> SyntaxError (PEP 701 f-strings)
        #   >= 3.13.1 -> topotherm deklariert requires-python "<=3.13"; nach
        #               PEP 440 ist 3.13.11 NICHT <= 3.13, pip bricht ab.
        #               setup-python liefert immer den neuesten Patch, also
        #               scheitert "3.13" hier. Wieder aufnehmen, sobald
        #               topotherm die Obergrenze korrigiert (<3.14).
        python-version: ["3.12"]

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Projekt mit topotherm und HiGHS installieren
        # topotherm MUSS editable installiert werden: sein eigenes Packaging
        # deklariert packages = ["topotherm"] und laesst damit das Subpackage
        # topotherm.models weg. Ein normaler Install liefert ein Paket, dessen
        # __init__ an "from . import models" stirbt (irrefuehrend als circular
        # import gemeldet). --src legt den Checkout ausserhalb des Repos ab,
        # damit er nicht in fheats eigenes src/ geraet.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[full,dev,excel,plots,topotherm]"
          python -m pip install --editable \
            "git+https://github.com/jylambert/topotherm@v0.6.0#egg=topotherm" \
            --src "${{ runner.temp }}/vendor"

      - name: Sicherstellen, dass topotherm wirklich nutzbar ist
        # Ohne diese Prüfung würde der Job auch dann grün, wenn die
        # tt-Fixture alle MILP-Tests stillschweigend überspringt.
        run: |
          python -c "import topotherm, topotherm.models, importlib.metadata as md; print('topotherm', md.version('topotherm'))"
          python -c "import pyomo.environ as pyo; assert pyo.SolverFactory('highs').available(False), 'HiGHS-Solver nicht verfuegbar'"

      - name: Expert-Modus-Tests ausführen
        run: python -m pytest tests/test_network_expert.py -v

  xwaermeplan-xplan-tools:
    # Unabhängiger Prüfstein für die XWärmeplan-GML (docs/xwaermeplan, Plan
    # Abschnitt 2.1 und Phase 10): Die GML-Ausgaben von F|Heat müssen sich mit
    # XPlan-Tools, dem Werkzeug der XLeitstelle, fehlerfrei einlesen lassen.
    # Eigener Job, weil XPlan-Tools 1.26 Python 3.13 und die GDAL-Python-
    # Bindung verlangt. JSON-FG wird hier bewusst NICHT geprüft: XPlan-Tools
    # schreibt und erwartet ein JSON-FG, das vom offiziellen Schema abweicht
    # (abgleich.md, J1); JSON-FG prüft der normale Testlauf gegen das Schema.
    # Version gepinnt; XPlan-Tools geht in xmas-core auf (2.0 noch rc, Python 3.14).
    name: XWärmeplan-GML mit XPlan-Tools lesen (Python 3.13)
    runs-on: ubuntu-24.04

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python 3.13 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: GDAL installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev

      - name: F|Heat und XPlan-Tools installieren
        # Die GDAL-Python-Bindung muss zur Systembibliothek passen.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "gdal==$(gdal-config --version)"
          python -m pip install "xplan-tools==1.26.0"
          python -m pip install --editable ".[xwp,nrw]"  # nrw: das Beispiel nutzt die NRW-Gebäudeverarbeitung

      - name: XWärmeplan-GML schreiben (alle Objektarten, Beispiel Burgsteinfurt)
        run: python scripts/write_xwp_samples.py "${{ runner.temp }}/xwp"

      - name: GML mit XPlan-Tools einlesen
        run: |
          set -e
          for gml in "${{ runner.temp }}"/xwp/*.gml; do
            echo "::group::$(basename "$gml")"
            xplan-tools convert "$gml" "${gml%.gml}.xplan-tools.json"
            echo "::endgroup::"
          done
